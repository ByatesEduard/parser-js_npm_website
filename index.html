<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Landing</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7fb;
      color: #222;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 16px;
      font-weight: normal;
      color: #666;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Новая программа тренировок на 30 дней</h1>
    <h2>Достигай результата без диет и стресса</h2>
    <button id="cta">Попробовать бесплатно</button>
    <footer>© 2025 Моя компания</footer>
  </div>

  <script>
    // ---------- helpers ----------

    function isBot() {
      return navigator.userAgent.toLowerCase().includes('bot');
    }

    function getClickId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('click_id'), console.log('click');
    }

    // ---------- fake Facebook Pixel ----------

    function fbq(event, name, data = {}) {
      console.log('[FB PIXEL]', event, name, data);
    }

    // ---------- fake Keitaro API ----------

    function sendKeitaroEvent(payload) {
      console.log('[KEITARO API] sending:', payload);

      // тестовий запит
      fetch('https://example.com/keitaro', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      }).catch(() => {
        // помилка не важлива — це тест
      });
    }

    // ---------- PageView ----------

    if (!isBot()) {
      fbq('track', 'PageView');
    } else {
      console.log('BOT detected → tracking disabled');
    }

    // ---------- CTA click ----------

    document.getElementById('cta').addEventListener('click', () => {
      if (isBot()) return;

      const clickId = getClickId();

      fbq('track', 'Lead');

      sendKeitaroEvent({
        click_id: clickId,
        event: 'cta_click',
        timestamp: Date.now()
      });
    });
  </script>

</body>
</html>
